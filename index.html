<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Care — gestão hospitalar com triagem Manchester e ocupação em tempo real" />
    <title>Smart Care</title>
    <script>
      // Aplica o tema salvo antes do React montar, para não piscar a tela clara no modo escuro.
      try {
        const t = localStorage.getItem('smartcare:tema')
        const escuro = t ? t === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
